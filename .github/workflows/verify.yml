name: verify

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Verify
        run: corepack pnpm verify

  browser:
    name: Browser oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Install Chromium
        run: corepack pnpm --filter @gss-l/testing exec playwright install --with-deps chromium
      - name: Build workspace
        run: corepack pnpm build
      - name: Run browser oracle gate
        run: corepack pnpm --filter @gss-l/testing browser:check
      - name: Upload browser result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-reference-result
          path: artifacts/browser-reference.json
          if-no-files-found: warn
          retention-days: 14
